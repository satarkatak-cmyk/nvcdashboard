[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/api/*"
  to = "https://nfrteauxfgoowxulxvdc.supabase.co/functions/v1/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://raw.githubusercontent.com https://nfrteauxfgoowxulxvdc.supabase.co;"

[dev]
  command = "npm start"
  port = 3000
