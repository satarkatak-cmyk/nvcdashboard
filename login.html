    <script>
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin123';

        function isDashboardLoggedIn() {
            if (sessionStorage.getItem('dashboardLoggedIn') === 'true' && sessionStorage.getItem('dashboardAuthToken')) return true;
            return localStorage.getItem('dashboardRememberMe') === 'true' && !!localStorage.getItem('dashboardAuthToken');
        }

        function setDashboardLoggedIn(username, rememberMe, token, user) {
            sessionStorage.setItem('dashboardLoggedIn', 'true');
            sessionStorage.setItem('dashboardUsername', username);
            sessionStorage.setItem('dashboardAuthToken', token);
            sessionStorage.setItem('dashboardUser', JSON.stringify(user || { username }));

            if (rememberMe) {
                localStorage.setItem('dashboardRememberMe', 'true');
                localStorage.setItem('dashboardUsername', username);
                localStorage.setItem('dashboardAuthToken', token);
                localStorage.setItem('dashboardUser', JSON.stringify(user || { username }));
            } else {
                localStorage.removeItem('dashboardRememberMe');
                localStorage.removeItem('dashboardUsername');
                localStorage.removeItem('dashboardAuthToken');
                localStorage.removeItem('dashboardUser');
            }
        }

        function updateLoginStatCards() {
            const statTotal = document.getElementById('loginStatTotal');
            const statResolved = document.getElementById('loginStatResolved');
            if (!statTotal && !statResolved) return;

            const apiBaseUrl = (window.location.port === '5500' || window.location.port === '5501' || window.location.port === '8080')
                ? 'http://127.0.0.1:3000'
                : window.location.origin;

            fetch(`${apiBaseUrl}/api/ujuri/statistics`)
                .then(response => response.ok ? response.json() : Promise.reject(new Error('Stats fetch failed')))
                .then(result => {
                    const stats = result && result.success ? result.data : result || {};
                    const total = Number(stats.total || 0);
                    const resolved = Number(stats.resolved || 0);

                    if (statTotal) statTotal.textContent = String(total).replace(/[0-9]/g, digit => '०१२३४५६७८९'[digit]);
                    if (statResolved) statResolved.textContent = String(resolved).replace(/[0-9]/g, digit => '०१२३४५६७८९'[digit]);
                })
                .catch(() => {
                    if (statTotal) statTotal.textContent = '०';
                    if (statResolved) statResolved.textContent = '०';
                });
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const apiBaseUrl = (window.location.port === '5500' || window.location.port === '5501' || window.location.port === '8080')
                ? 'http://127.0.0.1:3000'
                : window.location.origin;

            try {
                const response = await fetch(`${apiBaseUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (response.ok) {
                    const result = await response.json();
                    setDashboardLoggedIn(username, rememberMe, result.token, result.data);
                    window.location.href = 'index.html';
                    return;
                }
            } catch (error) {
                console.error('Database login unavailable:', error);
            }

            alert('अमान्य युजरनेम वा पासवर्ड।');
        });

        // Initialize Nepal Map with GeoJSON
        function initNepalMap() {
            console.log('Starting GeoJSON map initialization...');
            try {
                const map = L.map('nepalMap', {
                    center: [28.3949, 84.1240],
                    zoom: 6,
                    zoomControl: false,
                    attributionControl: false
                });

                const districtCounts = {};

                function normalizeDistrictName(value) {
                    const cleanValue = String(value || '').trim();
                    if (!cleanValue) return '';
                    const mappedValue = window.DISTRICT_NAME_MAP && window.DISTRICT_NAME_MAP[cleanValue.toUpperCase()];
                    return mappedValue || cleanValue;
                }

                function getDistrictValueFromFeature(feature) {
                    const properties = feature && feature.properties ? feature.properties : {};
                    const rawName = properties.name || properties.DISTRICT || properties.District || properties.district || properties.NAME || properties.NAME_2 || '';
                    const districtName = normalizeDistrictName(rawName);
                    return Object.prototype.hasOwnProperty.call(districtCounts, districtName) ? districtCounts[districtName] : 0;
                }

                // Match the Ujiri district map bucket logic
                function getColor(value) {
                    if (!value) return '#E4E4E7';
                    if (value >= 25) return '#c96852';
                    if (value >= 11) return '#d6b84c';
                    if (value >= 1) return '#5aa469';
                    return '#E4E4E7';
                }

                function loadUjiriDistrictCounts() {
                    const staticPreviewPorts = ['5500', '5501', '8080'];
                    const defaultOrigin = (staticPreviewPorts.includes(String(window.location.port)))
                        ? 'http://127.0.0.1:3000'
                        : window.location.origin;

                    const fallbackApiOrigins = [
                        defaultOrigin,
                        'http://127.0.0.1:3000',
                        'http://localhost:3000'
                    ];

                    const apiOrigins = [...new Set(fallbackApiOrigins.filter(Boolean))];
                    const fetchFromApi = async (index = 0) => {
                        if (index >= apiOrigins.length) {
                            return;
                        }

                        const baseUrl = apiOrigins[index];
                        try {
                            const response = await fetch(`${baseUrl}/api/ujuri`);
                            if (!response.ok) {
                                throw new Error(`API request failed with ${response.status}`);
                            }
                            const result = await response.json();
                            const rows = result && Array.isArray(result.data) ? result.data : Array.isArray(result) ? result : [];
                            rows.forEach(row => {
                                const districtName = normalizeDistrictName(row && row.district ? row.district : '');
                                if (!districtName) return;
                                districtCounts[districtName] = (districtCounts[districtName] || 0) + 1;
                            });
                        } catch (error) {
                            return fetchFromApi(index + 1);
                        }
                    };

                    return fetchFromApi();
                }

                // Fetch GeoJSON data
                const geoJsonUrl = 'https://raw.githubusercontent.com/Acesmndr/nepal-geojson/master/generated-geojson/nepal-with-districts-acesmndr.geojson';
                
                Promise.all([
                    fetch(geoJsonUrl).then(response => response.json()),
                    loadUjiriDistrictCounts()
                ])
                    .then(([data]) => {
                        console.log('GeoJSON loaded successfully');
                        
                        // Add GeoJSON layer to map
                        L.geoJSON(data, {
                            style: function(feature) {
                                const value = getDistrictValueFromFeature(feature);
                                return {
                                    fillColor: getColor(value),
                                    weight: 1,
                                    opacity: 1,
                                    color: '#ffffff',
                                    dashArray: '3',
                                    fillOpacity: 0.7
                                };
                            },
                            onEachFeature: function(feature, layer) {
                                const properties = feature && feature.properties ? feature.properties : {};
                                const rawName = properties.name || properties.DISTRICT || properties.District || properties.district || properties.NAME || properties.NAME_2 || '';
                                const districtName = normalizeDistrictName(rawName);
                                const value = Object.prototype.hasOwnProperty.call(districtCounts, districtName) ? districtCounts[districtName] : 0;
                                
                                layer.bindPopup(`
                                    <div style="text-align: center; font-family: 'Noto Sans Devanagari', sans-serif;">
                                        <strong>${districtName}</strong><br>
                                        उजुरी संख्या: ${value}
                                    </div>
                                `);

                                layer.on('click', function() {
                                    this.setStyle({
                                        weight: 1,
                                        color: '#1a237e',
                                        dashArray: '',
                                        fillOpacity: 0.9
                                    });
                                });
                            }
                        }).addTo(map);
                        
                        // Fit map to Nepal bounds
                        map.fitBounds([
                            [26.34, 80.06],
                            [30.45, 88.20]
                        ]);
                        
                        console.log('Map initialized with GeoJSON successfully');
                    })
                    .catch(error => {
                        console.error('Error loading GeoJSON:', error);
                    });
            } catch (error) {
                console.log('Map initialization error:', error);
                console.error('Error details:', error.stack);
            }
        }

        // Initialize map when page loads with delay to ensure DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            if (isDashboardLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            console.log('DOM loaded, initializing map in 500ms...');
            setTimeout(initNepalMap, 500);
            updateLoginStatCards();
            updateNepaliDateTime();
            setInterval(updateNepaliDateTime, 1000);

            // Password toggle functionality
            const passwordToggle = document.getElementById('passwordToggle');
            const passwordInput = document.getElementById('password');
            
            if (passwordToggle && passwordInput) {
                passwordToggle.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    // Toggle eye icon
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }
        });

        // Nepali numerals conversion
        function toNepaliNumerals(num) {
            const nepaliNums = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
            return num.toString().split('').map(d => nepaliNums[parseInt(d)]).join('');
        }

        // Convert to Nepali date (Bikram Sambat) using NepaliCalendar API
        function toNepaliDate(date) {
            const nepaliDays = ['आइतबार', 'सोमबार', 'मंगलबार', 'बुधबार', 'बिहिबार', 'शुक्रबार', 'शनिबार'];
            
            // Use NepaliCalendar API to get current BS date
            const bsDateStr = window.NepaliCalendar.getCurrentDate();
            const parts = bsDateStr.split('-');
            const bsYear = parseInt(parts[0]);
            const bsMonth = parseInt(parts[1]);
            const bsDay = parseInt(parts[2]);
            
            // Get Nepali month name from API
            const monthName = window.NepaliCalendar.getMonthName(bsMonth);
            
            // Get day of week from current date
            const dayOfWeek = date.getDay();
            
            return `${nepaliDays[dayOfWeek]}, ${toNepaliNumerals(bsDay)} ${monthName} ${toNepaliNumerals(bsYear)}`;
        }

        // Convert to Nepali time
        function toNepaliTime(date) {
            const hours = date.getHours();
            const minutes = date.getMinutes();
            const seconds = date.getSeconds();
            
            return `${toNepaliNumerals(hours.toString().padStart(2, '0'))}:${toNepaliNumerals(minutes.toString().padStart(2, '0'))}:${toNepaliNumerals(seconds.toString().padStart(2, '0'))}`;
        }

        // Update Nepali date/time display
        function updateNepaliDateTime() {
            const now = new Date();
            const nepaliDateEl = document.getElementById('nepaliDate');
            const nepaliTimeEl = document.getElementById('nepaliTime');
            
            if (nepaliDateEl) {
                nepaliDateEl.textContent = toNepaliDate(now);
            }
            
            if (nepaliTimeEl) {
                nepaliTimeEl.textContent = toNepaliTime(now);
            }
        }
    </script>
</body>
